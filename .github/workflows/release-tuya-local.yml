name: Release Tuya Local fork for HACS

on:
  push:
    branches:
      - 'release/v*'

permissions:
  contents: write

jobs:
  validate:
    name: Validate HACS release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Check release version and HACS configuration
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"].removeprefix("release/")
          expected = tag.removeprefix("v")
          manifest = json.loads(Path("custom_components/tuya_local/manifest.json").read_text())
          hacs = json.loads(Path("hacs.json").read_text())
          assert manifest["domain"] == "tuya_local"
          assert manifest["version"] == expected, (manifest["version"], expected)
          assert hacs["zip_release"] is True
          assert hacs["filename"] == "tuya-local.zip"
          assert hacs["hide_default_branch"] is True
          assert Path("custom_components/tuya_local/www/vipera-schedule-card.js").is_file()
          assert Path("custom_components/tuya_local/devices/vipera_nex_home.yaml").is_file()
          print(f"Validating HACS release {tag}")
          PY
      - name: Run targeted Python tests
        run: uv run pytest tests/test_vipera_frontend.py tests/test_device_config.py
      - name: Check dashboard JavaScript modules
        shell: bash
        run: |
          for file in custom_components/tuya_local/www/*.js; do
            node --input-type=module --check < "$file"
          done
      - name: Validate Python formatting and YAML
        run: |
          uv run ruff check custom_components/tuya_local/__init__.py custom_components/tuya_local/vipera_frontend.py tests/test_vipera_frontend.py
          uv run ruff format --check custom_components/tuya_local/__init__.py custom_components/tuya_local/vipera_frontend.py tests/test_vipera_frontend.py
          uv run yamllint custom_components/tuya_local/devices/vipera_nex_home.yaml

  release:
    name: Publish stable ZIP release
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Determine release tag
        id: version
        shell: bash
        run: echo "tag=${GITHUB_REF_NAME#release/}" >> "$GITHUB_OUTPUT"
      - name: Build Tuya Local HACS integration ZIP
        shell: bash
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path

          src = Path("custom_components/tuya_local")
          output = Path("tuya-local.zip")
          files = sorted(
              p for p in src.rglob("*")
              if p.is_file()
              and "__pycache__" not in p.parts
              and p.suffix not in {".pyc", ".pyo"}
          )
          with zipfile.ZipFile(output, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for p in files:
                  archive.write(p, p.relative_to(src).as_posix())
          with zipfile.ZipFile(output) as archive:
              names = set(archive.namelist())
              assert "__init__.py" in names
              assert "manifest.json" in names
              assert "devices/vipera_nex_home.yaml" in names
              assert "www/vipera-schedule-card.js" in names
              print(f"Built {output}: {len(files)} files, {output.stat().st_size} bytes")
          PY
      - name: Publish tagged, non-prerelease GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Tuya Local fork ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: tuya-local.zip
          body: |
            Fork release with Vipera NEX HOME towel dryer profile, energy statistics
            metadata fix and a directly served schedule card.

            Install from HACS using this stable version. The archive contains
            only the required Tuya Local integration files (not the full source tree).
            New versioned Towel Dryers sidebar dashboard: Overview, Schedules,
            and long-term History with a tado X-compatible period picker.
            Existing tuya_local config entries and schedule cards are preserved.
