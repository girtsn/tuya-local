# Vipera / HeatQ NEX HOME towel dryer, custom Tuya Local profile v0.7.
# Schedule-reserved standby value: DP2=30 ONLY IF DP4=week_program.
# Outside Schedule mode, 30C remains a normal target (if DP1 is on).
# This inference requires all three dryers' schedules to avoid 30C slots.
# For schedule editing, use v0.7 schedule card (31..60C or OFF).
# Firmware setpoint 30C while idle has been observed, not vendor documented.
# Binary 'Heating requested' is NOT a direct electrical consumption meter.
# Climate 'temperature' maps to null only when Schedule mode and DP2 is 30C;
# raw 'Target temperature' sensor remains unchanged.
name: Vipera NEX HOME towel dryer
entities:
- entity: climate
  name: Heating element
  dps:
  - id: 1
    name: hvac_mode
    type: boolean
    mapping:
    - dps_val: false
      value: 'off'
    - dps_val: true
      constraint: preset_mode
      conditions:
      - dps_val: week_program
        value: auto
      - dps_val: manual
        value: heat
      - dps_val: timer_turbo
        value: heat
      - dps_val: timer_start_stop
        value: heat
  - id: 2
    name: temperature
    type: integer
    unit: C
    range:
      min: 30
      max: 60
    mapping:
    - dps_val: 30
      constraint: preset_mode
      conditions:
      - dps_val: week_program
        value: null
  - id: 3
    name: current_temperature
    type: integer
    mapping:
    - scale: 10
  - id: 4
    name: preset_mode
    type: string
    mapping:
    - dps_val: manual
      value: Manual
    - dps_val: week_program
      value: Schedule
    - dps_val: timer_turbo
      value: Turbo
    - dps_val: timer_start_stop
      value: Start/Stop timer
- entity: sensor
  name: Actual temperature
  class: temperature
  dps:
  - id: 3
    name: sensor
    type: integer
    unit: C
    class: measurement
    mapping:
    - scale: 10
- entity: sensor
  name: Target temperature
  class: temperature
  dps:
  - id: 2
    name: sensor
    type: integer
    unit: C
    class: measurement
- entity: binary_sensor
  name: Heating requested
  dps:
  - id: 1
    name: sensor
    type: boolean
    mapping:
    - dps_val: false
      value: false
    - dps_val: true
      value: true
      constraint: operating_mode
      conditions:
      - dps_val: week_program
        value_mirror: schedule_requested
  - id: 4
    name: operating_mode
    type: string
    readonly: true
    hidden: true
  - id: 2
    name: schedule_requested
    type: integer
    readonly: true
    hidden: true
    mapping:
    - dps_val: 30
      value: false
    - value: true
- entity: sensor
  name: Effective target temperature
  class: temperature
  dps:
  - id: 1
    name: sensor
    type: boolean
    unit: C
    class: measurement
    mapping:
    - dps_val: false
      value: null
    - dps_val: true
      value_mirror: target_if_enabled
  - id: 2
    name: target_if_enabled
    type: integer
    readonly: true
    hidden: true
    mapping:
    - dps_val: 30
      constraint: operating_mode
      conditions:
      - dps_val: week_program
        value: null
  - id: 4
    name: operating_mode
    type: string
    readonly: true
    hidden: true
- entity: lock
  name: Parental control
  category: config
  dps:
  - id: 7
    name: lock
    type: boolean
- entity: select
  name: Turbo duration
  category: config
  dps:
  - id: 19
    name: option
    type: string
    mapping:
    - dps_val: 1h
      value: 1h
    - dps_val: 2h
      value: 2h
    - dps_val: 3h
      value: 3h
    - dps_val: 4h
      value: 4h
    - dps_val: 5h
      value: 5h
    - dps_val: 6h
      value: 6h
- entity: select
  name: Start Stop duration
  category: config
  dps:
  - id: 111
    name: option
    type: string
    mapping:
    - dps_val: 1h
      value: 1h
    - dps_val: 2h
      value: 2h
    - dps_val: 3h
      value: 3h
    - dps_val: 4h
      value: 4h
    - dps_val: 5h
      value: 5h
    - dps_val: 6h
      value: 6h
- entity: sensor
  name: Timer remaining
  dps:
  - id: 20
    name: sensor
    type: integer
    unit: min
- entity: text
  name: Weekly schedule raw
  category: config
  dps:
  - id: 26
    optional: true
    name: value
    type: base64
    range:
      min: 224
      max: 224
- entity: text
  name: Appliance power watts
  category: config
  dps:
  - id: 101
    name: value
    type: string
    range:
      min: 3
      max: 5
- entity: sensor
  name: Estimated energy
  dps:
  - id: 102
    name: sensor
    type: integer
    unit: kWh
    class: measurement
    mapping:
    - scale: 100
- entity: number
  name: Energy price
  category: config
  dps:
  - id: 103
    name: value
    type: integer
    unit: EUR/kWh
    range:
      min: 1
      max: 10000
    mapping:
    - scale: 100
- entity: sensor
  name: Estimated energy cost
  dps:
  - id: 104
    name: sensor
    type: integer
    unit: EUR
    mapping:
    - scale: 100
- entity: button
  name: Reset estimated energy meter
  category: config
  dps:
  - id: 105
    name: button
    type: boolean
    optional: true
- entity: sensor
  name: Auxiliary value 110
  category: diagnostic
  dps:
  - id: 110
    name: sensor
    type: integer
- entity: binary_sensor
  name: Auxiliary flag 108
  category: diagnostic
  dps:
  - id: 108
    name: sensor
    type: boolean
- entity: binary_sensor
  name: Auxiliary flag 109
  category: diagnostic
  dps:
  - id: 109
    name: sensor
    type: boolean
- entity: sensor
  name: Auxiliary raw data 107
  category: diagnostic
  dps:
  - id: 107
    optional: true
    name: sensor
    type: base64
